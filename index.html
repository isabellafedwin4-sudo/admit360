<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Management System</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- EmailJS SDK Integration -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("WPSHHd8gunoVs1MIl");
        })();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; border: none; background: #e0e0e0; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 15px; }
        .tab-btn.active { background: #007bff; color: white; }

        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-bottom: 20px; color: #222; border-bottom: 2px solid #007bff; padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button.submit-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button.submit-btn:hover { background: #218838; }
        button:disabled { background-color: #94d3a2; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }
        .status-Pending { color: #d97706; font-weight: bold; }
        .status-Approved { color: #16a34a; font-weight: bold; }
        .status-Rejected { color: #dc2626; font-weight: bold; }

        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .approve-btn { background: #16a34a; }
        .reject-btn { background: #dc2626; }
        .doc-link { color: #007bff; text-decoration: none; font-weight: 500; }
        .doc-link:hover { text-decoration: underline; }

        #alertMessage { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchView('student')">Student Application Form</button>
        <button class="tab-btn" onclick="switchView('admin')">College Admin Panel</button>
    </div>

    <!-- STUDENT VIEW -->
    <div id="studentView" class="card">
        <h2>Student Admission Form</h2>
        <form id="admissionForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g., Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="jane@example.com" required>
            </div>
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" required>
                    <option value="">-- Choose a Course --</option>
                    <option value="CSE">Computer Science & Engineering (CSE)</option>
                    <option value="ECE">Electronics & Comm. Engineering (ECE)</option>
                    <option value="MEC">Mechanical Engineering (MEC)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="document">Upload Qualification Document</label>
                <input type="file" id="document" required>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn">Submit Application</button>
        </form>
        <div id="alertMessage"></div>

        <!-- APPLICATION TRACKING CARD -->
        <div style="margin-top: 30px; border-top: 2px dashed #e0e0e0; padding-top: 20px;">
            <h3>Check Application Status</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="email" id="trackEmail" placeholder="Enter your registered email address">
                <button onclick="checkStudentStatus()" class="tab-btn active" style="white-space: nowrap;">Track Status</button>
            </div>
            
            <div id="trackingResult" style="margin-top: 15px; display: none; padding: 15px; border-radius: 6px; background: #f8f9fa; border: 1px solid #e0e0e0;"></div>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminView" class="card" style="display: none;">
        
        <!-- ADMIN LOGIN FORM -->
        <div id="adminLoginForm" style="max-width: 400px; margin: 0 auto; padding: 10px 0;">
            <h2>Admin Login</h2>
            <div class="form-group" style="margin-top: 15px;">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" placeholder="admin@college.edu" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>
            <button onclick="handleAdminLogin()" class="submit-btn" style="background: #007bff;">Log In</button>
            <div id="loginError" style="color: red; margin-top: 10px; display: none;"></div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="adminContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="border: none; margin: 0;">College Admission Management</h2>
                <button onclick="handleAdminLogout()" class="action-btn reject-btn">Log Out</button>
            </div>
            <hr style="margin-bottom: 20px;">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Document</th>
                        <th>Status</th>
                        <th>Admission ID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
    // 1. SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://xdzrrhxvljvvynflrrhz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kl3CKdszTgL7QT4x8MV8eQ_2Z8IUSdP'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. TAB SWITCHING & AUTH CHECK
    async function switchView(view) {
        const studentView = document.getElementById('studentView');
        const adminView = document.getElementById('adminView');
        const tabBtns = document.querySelectorAll('.tab-btn');

        if (view === 'student') {
            studentView.style.display = 'block';
            adminView.style.display = 'none';
            tabBtns[0].classList.add('active');
            tabBtns[1].classList.remove('active');
        } else {
            studentView.style.display = 'none';
            adminView.style.display = 'block';
            tabBtns[1].classList.add('active');
            tabBtns[0].classList.remove('active');

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showAdminDashboard();
            } else {
                showAdminLoginForm();
            }
        }
    }

    // 3. ADMIN AUTHENTICATION
    async function handleAdminLogin() {
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const loginError = document.getElementById('loginError');

        loginError.style.display = 'none';

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            loginError.textContent = error.message;
            loginError.style.display = 'block';
        } else {
            showAdminDashboard();
        }
    }

    async function handleAdminLogout() {
        await supabaseClient.auth.signOut();
        showAdminLoginForm();
    }

    function showAdminDashboard() {
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        renderAdminTable();
    }

    function showAdminLoginForm() {
        document.getElementById('adminLoginForm').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
    }

    // 4. SUBMIT APPLICATION FORM
    document.getElementById('admissionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const alertMsg = document.getElementById('alertMessage');
        const fileInput = document.getElementById('document').files[0];

        if (!fileInput) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Uploading & Submitting...";
        alertMsg.style.display = 'none';

        try {
            const fileExt = fileInput.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `documents/${fileName}`;

            const { error: storageError } = await supabaseClient.storage
                .from('student-documents')
                .upload(filePath, fileInput);

            if (storageError) throw storageError;

            const { data: publicUrlData } = supabaseClient.storage
                .from('student-documents')
                .getPublicUrl(filePath);

            const { error: dbError } = await supabaseClient
                .from('applications')
                .insert([{
                    student_name: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    course_name: document.getElementById('course').value,
                    document_url: publicUrlData.publicUrl
                }]);

            if (dbError) throw dbError;

            alertMsg.className = 'alert-success';
            alertMsg.textContent = 'Application submitted successfully!';
            alertMsg.style.display = 'block';
            document.getElementById('admissionForm').reset();

        } catch (error) {
            alertMsg.className = 'alert-error';
            alertMsg.textContent = 'Error: ' + error.message;
            alertMsg.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Application";
        }
    });

    // 5. FETCH & RENDER APPLICATIONS
    async function renderAdminTable() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Loading applications...</td></tr>';

        const { data: applications, error } = await supabaseClient
            .from('applications')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            tbody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">Error: ${error.message}</td></tr>`;
            return;
        }

        if (applications.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No applications found.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        applications.forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${app.student_name}</td>
                <td>${app.email}</td>
                <td>${app.course_name}</td>
                <td><a href="${app.document_url}" target="_blank" class="doc-link">View Document</a></td>
                <td class="status-${app.status}">${app.status}</td>
                <td><strong>${app.admission_id ? app.admission_id : 'N/A'}</strong></td>
                <td>
                    ${app.status === 'Pending' ? `
                        <button class="action-btn approve-btn" onclick="processApplication('${app.id}', 'Approved')">Approve</button>
                        <button class="action-btn reject-btn" onclick="processApplication('${app.id}', 'Rejected')">Reject</button>
                    ` : 'Processed'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 6. PROCESS APPLICATION & TRIGGER EMAIL
    async function processApplication(id, newStatus) {
        try {
            // Fetch student details
            const { data: app, error: fetchError } = await supabaseClient
                .from('applications')
                .select('*')
                .eq('id', id)
                .single();

            if (fetchError) throw fetchError;

            // Update status in Supabase
            const { error: updateError } = await supabaseClient
                .from('applications')
                .update({ status: newStatus })
                .eq('id', id);

            if (updateError) throw updateError;

            // Fetch newly generated Admission ID
            const { data: updatedApp } = await supabaseClient
                .from('applications')
                .select('admission_id')
                .eq('id', id)
                .single();

            // Send notification via EmailJS if Approved
            if (newStatus === 'Approved' && updatedApp?.admission_id) {
                await sendApprovalEmail(app.email, app.student_name, updatedApp.admission_id);
            } else {
                console.log(`Application marked as ${newStatus}`);
            }

            renderAdminTable();
        } catch (error) {
            alert('Error updating application: ' + error.message);
        }
    }

    // 7. EMAILJS NOTIFICATION FUNCTION
    async function sendApprovalEmail(email, name, admissionId) {
        try {
            await emailjs.send("service_quk0cok", "template_hdbttxx", {
                to_email: email,
                to_name: name,
                admission_id: admissionId
            });
            console.log(`Application Approved & notification email sent to ${email}!`);
        } catch (error) {
            console.error('Email failed:', error);
            alert('Application approved, but failed to send email notification.');
        }
    }

    // 8. CHECK APPLICATION STATUS
    async function checkStudentStatus() {
        const email = document.getElementById('trackEmail').value.trim();
        const resultDiv = document.getElementById('trackingResult');

        if (!email) {
            alert('Please enter your email address.');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p>Searching...</p>';

        const { data: applications, error } = await supabaseClient
            .from('applications')
            .select('student_name, course_name, status, admission_id')
            .eq('email', email)
            .order('created_at', { ascending: false });

        if (error || !applications || applications.length === 0) {
            resultDiv.innerHTML = `<p style="color: #dc2626;">No application found for <strong>${email}</strong>.</p>`;
            return;
        }

        const app = applications[0];
        let statusColor = app.status === 'Approved' ? '#16a34a' : (app.status === 'Rejected' ? '#dc2626' : '#d97706');

        resultDiv.innerHTML = `
            <h4 style="margin-bottom: 8px;">Application Status for ${app.student_name}</h4>
            <p><strong>Course:</strong> ${app.course_name}</p>
            <p><strong>Status:</strong> <span style="color: ${statusColor}; font-weight: bold;">${app.status}</span></p>
            ${app.status === 'Approved' ? `
                <p style="margin-top: 8px; padding: 8px; background: #dcfce7; border: 1px solid #86efac; border-radius: 4px;">
                    🎉 <strong>Admission ID:</strong> <span style="font-size: 1.1em; font-weight: bold; color: #15803d;">${app.admission_id}</span>
                </p>
            ` : ''}
        `;
    }

    // Initialize Default View
    switchView('student');
</script>

</body>
</html>
